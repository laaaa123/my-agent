spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hmdp
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-fc5e7764d09d4a8d8ff8bf33623a4d72}
      chat:
        options:
          model: qwen-max
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b

server:
  port: 8123
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.yupi.yuaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ${SEARCH_API_KEY:你的APIKey}

logging:
  level:
    org.springframework.ai: DEBUG

knowledge:
  document:
    classpath-pattern: classpath*:document/**/*.*
    supported-extensions:
      - md
      - pdf
      - docx
    upload-dir: tmp/uploads
    ocr-enabled: true
    tesseract-path:
    max-chunk-size: 800
    overlap-size: 120
